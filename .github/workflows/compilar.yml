# Compila OptimizadorPC.exe en los servidores de GitHub.
# - En cada push: deja el .exe como "artifact" descargable en la pestaña Actions.
# - Al subir una etiqueta de versión (por ejemplo v1.0): crea una Release con el .exe adjunto.
name: Compilar

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar la app
        shell: powershell
        run: ./build.ps1

      - name: Guardar el .exe
        uses: actions/upload-artifact@v4
        with:
          name: OptimizadorPC
          path: dist/OptimizadorPC.exe

      - name: Publicar la versión
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OptimizadorPC.exe
          generate_release_notes: true
